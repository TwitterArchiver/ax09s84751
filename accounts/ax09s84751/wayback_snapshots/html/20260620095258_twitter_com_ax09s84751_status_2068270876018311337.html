  <br/>
  1. 强效抑制5-羟色胺再摄取：像传统SSRI一样，阻断5-羟色胺（5-HT）的回收，提高大脑突触间隙的血清素浓度 。
  <br/>
  2. 5-HT1A受体部分激动剂：这是它与常规药物的核心区别 。它能直接刺激5-HT1A受体，加速自身受体的脱敏过程 。
  <br/>
